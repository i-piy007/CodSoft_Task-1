<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

            margin: 0;
            padding: 0;            
        }
        body{
            background-color: rgb(58, 8, 80);

    <header>
        <nav>
            <div class="left">My Portfolio</div>

                <ul>
                    <li>Home</li>

</html>
